[project]
name = "credit-agreement-extractor"
version = "0.1.0"
description = "Structured extraction scaffold for credit agreements"
requires-python = ">=3.11,<3.12"
dependencies = [
    "docling[rapidocr]>=2,<3",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_agreement_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
